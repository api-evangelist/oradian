aid: oradian
name: Oradian
description: >-
  Oradian is an AI-native, cloud-based core banking platform that helps banks,
  lenders, microfinance institutions, and fintechs in Asia, Africa, and Europe
  replace legacy core systems and launch, operate, and scale modern banking
  services from the cloud. Its product, Instafin, is built API-first around an
  open data model, an extensible architecture, and a native Model Context
  Protocol surface, exposing capabilities such as ledgers, transactions,
  deposits, cards, loans, and applications through stable, versioned APIs,
  webhooks, and event streams. Oradian is independently audited to SOC 2 and
  ISO 27001 and aligns to CBN, BSP, and OJK regulatory requirements.
